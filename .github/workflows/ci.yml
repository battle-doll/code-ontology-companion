name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:
    inputs:
      validation_scope:
        description: Release gate or explicitly scoped Windows diagnosis
        type: choice
        default: release
        options: [release, windows_probe, windows_focused]

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  version-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate public source and Git identity history
        run: python scripts/validate_public_privacy.py --source --git-history
      - name: Require a version bump against the pull-request base
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: python scripts/validate_version_bump.py --base-ref "$BASE_REF"
      - name: Require a version bump against the previous pushed revision
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        env:
          BASE_REF: ${{ github.event.before }}
        run: python scripts/validate_version_bump.py --base-ref "$BASE_REF"
      - name: Require a candidate version bump for direct branch validation
        if: github.event_name == 'workflow_dispatch' && github.ref_name != github.event.repository.default_branch
        env:
          BASE_REF: origin/${{ github.event.repository.default_branch }}
        run: python scripts/validate_version_bump.py --base-ref "$BASE_REF"

  validate:
    if: github.event.inputs.validation_scope != 'windows_probe' && github.event.inputs.validation_scope != 'windows_focused'
    strategy:
      fail-fast: false
      matrix:
        # Python 3.9 is unavailable on Ubuntu 26.04 (the new ubuntu-latest).
        os: [ubuntu-24.04, macos-15, windows-latest]
        python: ["3.9", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up the guarded partitioned-export test runtime
        id: export_python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Prepare validation-only dependencies and guarded runtimes
        # Tool-cache interpreters may be group-writable. Provision the real
        # runner files; keep the product's writable-runtime rejection intact.
        env:
          CODE_ONTOLOGY_TEST_EXPORT_PYTHON: ${{ steps.export_python.outputs.python-path }}
        run: |
          python -m pip install -r requirements-validation.txt
          python -c "import os,pathlib; cache=pathlib.Path(os.environ['RUNNER_TEMP'])/'code-ontology-validation-pycache'; cache.mkdir(mode=0o700,exist_ok=True); pathlib.Path(os.environ['GITHUB_ENV']).open('a',encoding='utf-8').write('PYTHONPYCACHEPREFIX='+str(cache)+'\n')"
          python -c "import os,pathlib,stat,subprocess,sys; paths={pathlib.Path(sys.executable).resolve(),pathlib.Path(os.environ['CODE_ONTOLOGY_TEST_EXPORT_PYTHON']).resolve()}; [(p.chmod(stat.S_IMODE(p.stat().st_mode) & ~0o022) if p.stat().st_uid == os.getuid() else subprocess.run(['sudo','-n','chmod','go-w',str(p)],check=True)) for p in paths if os.name != 'nt' and p.stat().st_mode & 0o022]"
      - name: Validate Node launcher syntax
        run: node --check mcp/launcher.mjs
      - name: Validate release tooling syntax
        run: >-
          python -m py_compile
          scripts/build_release.py
          scripts/build_skills_only_release.py
          scripts/validate_release_artifact.py
          scripts/validate_visualization_quality.py
          scripts/validate_version_bump.py
          skills/manage-code-ontology/scripts/code_reference.py
          skills/apply-code-ontology/scripts/apply_workflow.py
      - name: Validate source, boundaries, metadata, and tests
        if: runner.os != 'Windows'
        env:
          CODE_ONTOLOGY_TEST_EXPORT_PYTHON: ${{ steps.export_python.outputs.python-path }}
        run: python scripts/validate_package.py
      - name: Validate with private Windows fixture ownership and ACLs
        if: runner.os == 'Windows'
        env:
          CODE_ONTOLOGY_TEST_EXPORT_PYTHON: ${{ steps.export_python.outputs.python-path }}
        run: python scripts/run_windows_validation.py

  rdf-contract:
    if: github.event.inputs.validation_scope != 'windows_probe' && github.event.inputs.validation_scope != 'windows_focused'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install isolated validation-only RDF dependencies
        run: python -m pip install -r requirements-validation.txt
      - name: Independently validate RDF graph parity and SHACL contracts
        run: python -m unittest discover -s tests -p 'test_*rdf_contract.py' -v

  package:
    needs: [version-policy, validate, rdf-contract]
    if: github.event.inputs.validation_scope != 'windows_probe' && github.event.inputs.validation_scope != 'windows_focused'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prepare isolated archive-validation dependencies
        # The complete source suite is required by all six upstream matrix jobs.
        run: |
          python -m pip install -r requirements-validation.txt
          python -c "import os,pathlib; cache=pathlib.Path(os.environ['RUNNER_TEMP'])/'code-ontology-validation-pycache'; cache.mkdir(mode=0o700,exist_ok=True); pathlib.Path(os.environ['GITHUB_ENV']).open('a',encoding='utf-8').write('PYTHONPYCACHEPREFIX='+str(cache)+'\n')"
          python -c "import os,pathlib,stat,subprocess,sys; p=pathlib.Path(sys.executable).resolve(); (p.chmod(stat.S_IMODE(p.stat().st_mode) & ~0o022) if p.stat().st_uid == os.getuid() else subprocess.run(['sudo','-n','chmod','go-w',str(p)],check=True)) if os.name != 'nt' and p.stat().st_mode & 0o022 else None"
      - name: Verify the validated source revision
        run: |
          git diff --exit-code
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Build both deterministic profiles from the validated source
        run: |
          python -c "import sys,hashlib; sys.path.insert(0,'scripts'); import build_release as builder; builder.build_archive(builder.OUTPUT); builder.OUTPUT.with_suffix('.zip.sha256').write_text(hashlib.sha256(builder.OUTPUT.read_bytes()).hexdigest()+'  '+builder.OUTPUT.name+'\n',encoding='ascii')"
          python -c "import sys,hashlib; sys.path.insert(0,'scripts'); import build_skills_only_release as builder; builder.build_archive(builder.OUTPUT); builder.OUTPUT.with_suffix('.zip.sha256').write_text(hashlib.sha256(builder.OUTPUT.read_bytes()).hexdigest()+'  '+builder.OUTPUT.name+'\n',encoding='ascii')"
          sha256sum dist/*.zip > /tmp/code-ontology-first-build.sha256
          mkdir -p "$RUNNER_TEMP/code-ontology-first-build"
          cp dist/*.zip "$RUNNER_TEMP/code-ontology-first-build/"
      - name: Rebuild in independent processes and compare bytes
        run: |
          python -c "import sys,hashlib; sys.path.insert(0,'scripts'); import build_release as builder; builder.build_archive(builder.OUTPUT); builder.OUTPUT.with_suffix('.zip.sha256').write_text(hashlib.sha256(builder.OUTPUT.read_bytes()).hexdigest()+'  '+builder.OUTPUT.name+'\n',encoding='ascii')"
          python -c "import sys,hashlib; sys.path.insert(0,'scripts'); import build_skills_only_release as builder; builder.build_archive(builder.OUTPUT); builder.OUTPUT.with_suffix('.zip.sha256').write_text(hashlib.sha256(builder.OUTPUT.read_bytes()).hexdigest()+'  '+builder.OUTPUT.name+'\n',encoding='ascii')"
          sha256sum --check /tmp/code-ontology-first-build.sha256
          cmp "$RUNNER_TEMP/code-ontology-first-build/code-ontology-companion-0.9.3.zip" dist/code-ontology-companion-0.9.3.zip
          cmp "$RUNNER_TEMP/code-ontology-first-build/code-ontology-companion-skills-only-0.9.3.zip" dist/code-ontology-companion-skills-only-0.9.3.zip
          git diff --exit-code
      - name: Validate both extracted profiles and application routing
        run: |
          python scripts/validate_release_artifact.py \
            dist/code-ontology-companion-0.9.3.zip \
            --profile full \
            --checksum
          python scripts/validate_release_artifact.py \
            dist/code-ontology-companion-skills-only-0.9.3.zip \
            --profile skills-only \
            --checksum
      - name: Validate public release archives for private data
        run: >-
          python scripts/validate_public_privacy.py
          --archive dist/code-ontology-companion-0.9.3.zip
          --archive dist/code-ontology-companion-skills-only-0.9.3.zip
      - name: Upload full and skills-only release candidates
        uses: actions/upload-artifact@v4
        with:
          name: code-ontology-companion-release
          path: |
            dist/code-ontology-companion-0.9.3.zip
            dist/code-ontology-companion-0.9.3.zip.sha256
            dist/code-ontology-companion-skills-only-0.9.3.zip
            dist/code-ontology-companion-skills-only-0.9.3.zip.sha256

  windows-diagnostic:
    if: github.event_name == 'workflow_dispatch' && (github.event.inputs.validation_scope == 'windows_probe' || github.event.inputs.validation_scope == 'windows_focused')
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12"]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: export_python
        with:
          python-version: "3.12"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Prepare isolated diagnostic dependencies
        run: python -m pip install -r requirements-validation.txt
      - name: Native probes only
        if: github.event.inputs.validation_scope == 'windows_probe'
        env:
          CODE_ONTOLOGY_TEST_EXPORT_PYTHON: ${{ steps.export_python.outputs.python-path }}
        run: python scripts/probe_windows_release.py
      - name: Scoped Windows regression modules only
        if: github.event.inputs.validation_scope == 'windows_focused'
        env:
          CODE_ONTOLOGY_TEST_EXPORT_PYTHON: ${{ steps.export_python.outputs.python-path }}
        run: python scripts/probe_windows_release.py --tests
