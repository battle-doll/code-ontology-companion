name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Require a version bump against the pull-request base
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: python scripts/validate_version_bump.py --base-ref "$BASE_REF"
      - name: Require a version bump against the previous pushed revision
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        env:
          BASE_REF: ${{ github.event.before }}
        run: python scripts/validate_version_bump.py --base-ref "$BASE_REF"

  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
        python: ["3.9", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate Node launcher syntax
        run: node --check mcp/launcher.mjs
      - name: Validate release tooling syntax
        run: >-
          python -m py_compile
          scripts/build_release.py
          scripts/build_skills_only_release.py
          scripts/validate_release_artifact.py
          scripts/validate_version_bump.py
      - name: Validate source, boundaries, metadata, and tests
        run: python scripts/validate_package.py

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build both deterministic release profiles
        run: |
          python scripts/build_release.py
          python scripts/build_skills_only_release.py
          sha256sum dist/*.zip > /tmp/code-ontology-first-build.sha256
      - name: Rebuild in independent processes and compare bytes
        run: |
          python scripts/build_release.py
          python scripts/build_skills_only_release.py
          sha256sum --check /tmp/code-ontology-first-build.sha256
      - name: Validate completed release artifacts
        run: |
          python scripts/validate_release_artifact.py \
            dist/code-ontology-companion-0.3.2.zip \
            --profile full \
            --checksum
          python scripts/validate_release_artifact.py \
            dist/code-ontology-companion-skills-only-0.3.2.zip \
            --profile skills-only \
            --checksum
      - name: Upload full and skills-only release candidates
        uses: actions/upload-artifact@v4
        with:
          name: code-ontology-companion-release
          path: |
            dist/code-ontology-companion-0.3.2.zip
            dist/code-ontology-companion-0.3.2.zip.sha256
            dist/code-ontology-companion-skills-only-0.3.2.zip
            dist/code-ontology-companion-skills-only-0.3.2.zip.sha256
