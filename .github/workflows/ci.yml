name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
        python: ["3.9", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate Node launcher syntax
        run: node --check mcp/launcher.mjs
      - name: Validate source, boundaries, metadata, and tests
        run: python scripts/validate_package.py

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build deterministic release
        run: python scripts/build_release.py
      - name: Upload release candidate
        uses: actions/upload-artifact@v4
        with:
          name: code-ontology-companion-release
          path: |
            dist/*.zip
            dist/*.sha256
