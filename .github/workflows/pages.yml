name: Public self-ontology
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-self-ontology
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'battle-doll/code-ontology-companion' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build from committed source and check public data boundary
        run: python scripts/build_self_demo.py --output "$RUNNER_TEMP/self-ontology-site"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/self-ontology-site
  deploy:
    if: github.repository == 'battle-doll/code-ontology-companion' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
